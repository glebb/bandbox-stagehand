# iPhone app project; generate it with `xcodegen` (ios-build.sh does this).
name: Stagehand
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  Stagehand:
    type: application
    platform: iOS
    sources:
      - Sources/Shared
      - Sources/iOS
      - iOS/Assets.xcassets
      - path: Fonts/Yellowtail-Regular.ttf
        buildPhase: resources
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: Stagehand
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Yellowtail-Regular.ttf
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSBluetoothAlwaysUsageDescription: Stagehand connects to your JBL BandBox Trio over Bluetooth to change tones, pedals, volumes, STEM AI and the tuner.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.bandbox-stagehand   # ios-build.sh sets yours from signing.env
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.0.0          # ios-build.sh sets both from version.sh
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic   # team from signing.env, passed by ios-build.sh
